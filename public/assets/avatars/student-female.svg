<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background studio glow -->
    <radialGradient id="femaleBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- 3D Skin Tone -->
    <radialGradient id="faceGradFemale" cx="42%" cy="38%" r="56%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="65%" stop-color="#fba872"/>
      <stop offset="100%" stop-color="#d97745"/>
    </radialGradient>

    <!-- 3D Long Hair Gradient -->
    <linearGradient id="hairGradFemale" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3b2016"/>
      <stop offset="45%" stop-color="#24140e"/>
      <stop offset="100%" stop-color="#120906"/>
    </linearGradient>

    <!-- Hair highlight -->
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d3c2a"/>
      <stop offset="50%" stop-color="#9a583e"/>
      <stop offset="100%" stop-color="#6d3c2a"/>
    </linearGradient>

    <!-- Collegiate Teal/Navy Blazer -->
    <linearGradient id="blazerGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="femaleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#femaleBg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Back Hair Droop Behind Shoulders -->
  <path d="M54 75 C48 100, 48 135, 52 165 C54 175, 58 178, 64 170 C72 155, 74 135, 74 115 Z" fill="url(#hairGradFemale)"/>
  <path d="M146 75 C152 100, 152 135, 148 165 C146 175, 142 178, 136 170 C128 155, 126 135, 126 115 Z" fill="url(#hairGradFemale)"/>

  <!-- Torso & Shoulders -->
  <g filter="url(#femaleShadow)">
    <path d="M42 165 C45 138, 70 130, 100 130 C130 130, 155 138, 158 165 C160 178, 160 200, 160 200 L40 200 C40 200, 40 178, 42 165 Z" fill="url(#blazerGradFemale)"/>
    
    <!-- White Inner Shirt / V-neck -->
    <path d="M86 130 L114 130 L106 156 C103 160, 97 160, 94 156 Z" fill="#f8fafc"/>
    <!-- Subtle Necklace / Chain -->
    <path d="M92 140 C96 146, 104 146, 108 140" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
    <circle cx="100" cy="144" r="2" fill="#38bdf8"/>
  </g>

  <!-- Neck -->
  <path d="M88 114 L112 114 L112 133 C106 136, 94 136, 88 133 Z" fill="#d97745"/>

  <!-- Head / Face Group -->
  <g filter="url(#femaleShadow)">
    <!-- Ears -->
    <ellipse cx="66" cy="94" rx="6.5" ry="10" fill="#fba872"/>
    <ellipse cx="134" cy="94" rx="6.5" ry="10" fill="#fba872"/>
    <!-- Small pearl earrings -->
    <circle cx="65" cy="99" r="2.5" fill="#f8fafc"/>
    <circle cx="135" cy="99" r="2.5" fill="#f8fafc"/>

    <!-- Soft Curved Jaw & Face -->
    <path d="M70 82 C70 56, 130 56, 130 82 C130 106, 115 124, 100 124 C85 124, 70 106, 70 82 Z" fill="url(#faceGradFemale)"/>

    <!-- Cheeks (Blush) -->
    <circle cx="78" cy="98" r="7" fill="#f43f5e" opacity="0.16"/>
    <circle cx="122" cy="98" r="7" fill="#f43f5e" opacity="0.16"/>

    <!-- Eyes (Expressive, Bright) -->
    <ellipse cx="86" cy="88" rx="4.5" ry="5.5" fill="#1e293b"/>
    <circle cx="87.5" cy="86" r="1.8" fill="#ffffff"/>
    <circle cx="84.5" cy="89" r="0.9" fill="#ffffff"/>
    <ellipse cx="114" cy="88" rx="4.5" ry="5.5" fill="#1e293b"/>
    <circle cx="115.5" cy="86" r="1.8" fill="#ffffff"/>
    <circle cx="112.5" cy="89" r="0.9" fill="#ffffff"/>

    <!-- Eyelashes -->
    <path d="M81 83 C85 81, 91 81, 93 84" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M80 82 L77 80" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M107 84 C109 81, 115 81, 119 83" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M120 82 L123 80" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Soft Eyebrows -->
    <path d="M79 78 C83 75, 89 75, 93 77" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M107 77 C111 75, 117 75, 121 78" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <path d="M99 87 L98 97 C98 99, 102 99, 102 97 Z" fill="#d97745"/>

    <!-- Warm Friendly Smile -->
    <path d="M90 106 C94 112, 106 112, 110 106" stroke="#9f1239" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M93 107 C96 110, 104 110, 107 107" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Front Hair Waves & Parting -->
  <g>
    <!-- Hair Volume Top -->
    <path d="M66 74 C66 42, 84 30, 100 30 C118 30, 134 42, 134 74 C128 54, 114 42, 98 42 C82 42, 70 54, 66 74 Z" fill="url(#hairGradFemale)"/>
    <!-- Soft Wave Left Side -->
    <path d="M66 70 C64 90, 68 112, 74 125 C76 122, 76 110, 74 95 C72 82, 70 75, 66 70 Z" fill="#3b2016"/>
    <!-- Soft Wave Right Side -->
    <path d="M134 70 C136 90, 132 112, 126 125 C124 122, 124 110, 126 95 C128 82, 130 75, 134 70 Z" fill="#3b2016"/>
    <!-- Hair Sheen Highlight -->
    <path d="M78 44 C88 38, 112 38, 122 44" stroke="url(#hairSheen)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Bottom Tag -->
  <rect x="74" y="184" width="52" height="12" rx="4" fill="#0c4a6e" opacity="0.95"/>
  <text x="100" y="193" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.6">STUDENT</text>
</svg>
